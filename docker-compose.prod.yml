# ═══════════════════════════════════════════════════════════════════════════════
# Neo3D — Production Docker Compose Stack (AWS EC2 - t3a.medium)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy & SSL Termination
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: neo3d_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - neo3d_net

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND — Next.js
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USER:-neo3d}/neo3d-frontend:latest
    container_name: neo3d_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USER:-neo3d}/neo3d-backend:latest
    container_name: neo3d_backend
    restart: always
    environment:
      - COLMAP_PATH=/usr/bin/colmap
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - MAX_UPLOAD_MB=2048
      - MIN_IMAGES=5
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql+asyncpg://neo3d:neo3d_secret_password@db:5432/neo3d
    volumes:
      - neo3d_datasets:/app/datasets
      - neo3d_outputs:/app/outputs
      - neo3d_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────────────────
  # WORKER — COLMAP Reconstruction Engine
  # ─────────────────────────────────────────────────────────────────────────────
  worker:
    image: ${DOCKER_USER:-neo3d}/neo3d-worker:latest
    container_name: neo3d_worker
    profiles:
      - reconstruction
    environment:
      - COLMAP_PATH=/usr/bin/colmap
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONUTF8=1
    volumes:
      - neo3d_datasets:/datasets
      - neo3d_outputs:/outputs
      - neo3d_logs:/logs
    deploy:
      resources:
        limits:
          memory: 2.5G      # Strict limit to prevent OOM on 4GB host
          cpus: '2.0'       # Use 2 vCPUs
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASE — PostgreSQL 15
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: neo3d_db
    restart: always
    environment:
      - POSTGRES_USER=neo3d
      - POSTGRES_PASSWORD=neo3d_secret_password
      - POSTGRES_DB=neo3d
    volumes:
      - neo3d_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo3d -d neo3d"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  neo3d_datasets:
    name: neo3d_datasets
  neo3d_outputs:
    name: neo3d_outputs
  neo3d_logs:
    name: neo3d_logs
  neo3d_db_data:
    name: neo3d_db_data

networks:
  neo3d_net:
    driver: bridge
    name: neo3d_network
