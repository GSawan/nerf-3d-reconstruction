# ═══════════════════════════════════════════════════════════════════════════════
# Neo3D — Production Docker Compose Stack
# Services: Nginx, Frontend, Backend, Worker, DB, Prometheus, Grafana
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy: routes /, /api, /grafana, /prometheus
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: neo3d_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - grafana
    networks:
      - neo3d_net

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND — Next.js
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USER:-neo3d}/neo3d-frontend:latest
    container_name: neo3d_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — FastAPI (exposes /metrics for Prometheus)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USER:-neo3d}/neo3d-backend:latest
    container_name: neo3d_backend
    restart: always
    environment:
      - COLMAP_PATH=/usr/bin/colmap
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - MAX_UPLOAD_MB=2048
      - MIN_IMAGES=5
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql+asyncpg://neo3d:${POSTGRES_PASSWORD:-neo3d_secret}@db:5432/neo3d
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET=${S3_BUCKET:-}
    volumes:
      - neo3d_datasets:/app/datasets
      - neo3d_outputs:/app/outputs
      - neo3d_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────────────────
  # WORKER — COLMAP Reconstruction Engine
  # ─────────────────────────────────────────────────────────────────────────────
  worker:
    image: ${DOCKER_USER:-neo3d}/neo3d-worker:latest
    container_name: neo3d_worker
    profiles:
      - reconstruction
    environment:
      - COLMAP_PATH=/usr/bin/colmap
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONUTF8=1
    volumes:
      - neo3d_datasets:/datasets
      - neo3d_outputs:/outputs
      - neo3d_logs:/logs
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: '2.0'
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASE — PostgreSQL 15
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: neo3d_db
    restart: always
    environment:
      - POSTGRES_USER=neo3d
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neo3d_secret}
      - POSTGRES_DB=neo3d
    volumes:
      - neo3d_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo3d -d neo3d"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMETHEUS — Metrics collector
  # Access: http://<elastic-ip>/prometheus
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: neo3d_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # GRAFANA — Dashboards
  # Access: http://<elastic-ip>/grafana
  # Default login: admin / neo3d_grafana (change in .env)
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: neo3d_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-neo3d_grafana}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  neo3d_datasets:
    name: neo3d_datasets
  neo3d_outputs:
    name: neo3d_outputs
  neo3d_logs:
    name: neo3d_logs
  neo3d_db_data:
    name: neo3d_db_data
  prometheus_data:
    name: neo3d_prometheus_data
  grafana_data:
    name: neo3d_grafana_data

networks:
  neo3d_net:
    driver: bridge
    name: neo3d_network
