# ═══════════════════════════════════════════════════════════════════════════════
# Neo3D — Jenkins CI Server Stack
#
# This is a SEPARATE compose file from docker-compose.yml.
# Run with: docker compose -f docker-compose.jenkins.yml up -d
#
# Why separate?
#   - Jenkins should NOT be part of the production app stack
#   - Jenkins is a CI tool — it builds and tests the app, not part of it
#   - Separate file allows: start Jenkins independently, without affecting
#     the app containers
#
# Docker Socket Mounting (/var/run/docker.sock):
#   - This gives Jenkins access to the HOST's Docker daemon
#   - Jenkins can then run `docker build`, `docker compose`, etc.
#   - This is "DinD-lite" (Docker-in-Docker without the complexity)
#   - Security note: This gives Jenkins root-equivalent access to Docker.
#     Acceptable for local CI; in production, use Docker-in-Docker or Kaniko.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: neo3d-jenkins:latest
    container_name: neo3d_jenkins
    restart: unless-stopped
    ports:
      # Web UI — access Jenkins at http://localhost:8080
      - "${JENKINS_PORT:-8080}:8080"
      # JNLP agent port (for distributed builds — not needed for single-node)
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      # Persistent Jenkins data — jobs, configs, plugins, build history
      # CRITICAL: without this, all Jenkins config is lost on container restart
      - jenkins_home:/var/jenkins_home

      # Docker socket mount — gives Jenkins access to host Docker daemon
      # This is what allows Jenkins to run `docker compose build` etc.
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount the Neo3D repo so Jenkins can access it without cloning
      # (for local development — in production, Jenkins would clone from Git)
      - .:/workspace/neo3d:ro
    environment:
      # Jenkins admin credentials (change these!)
      - JENKINS_ADMIN_USER=admin
      - JENKINS_ADMIN_PASSWORD=neo3d_ci_2024
      # Git repo for pipeline
      - GIT_REPO_URL=${GIT_REPO_URL:-https://github.com/sawangajjela/neo3d.git}
      - GIT_BRANCH=${GIT_BRANCH:-main}
    networks:
      - jenkins_net

volumes:
  jenkins_home:
    name: neo3d_jenkins_home

networks:
  jenkins_net:
    driver: bridge
    name: neo3d_jenkins_network
