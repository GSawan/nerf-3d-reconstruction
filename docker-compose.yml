# ═══════════════════════════════════════════════════════════════════════════════
# Neo3D — Docker Compose Stack
# Pipeline: Upload → COLMAP → Reconstruction → Three.js Viewer
#
# Services:
#   frontend    - Next.js UI                    (host port 3001)
#   backend     - FastAPI API server             (host port 8001)
#   prometheus  - Metrics scraper               (host port 9090)
#   grafana     - Monitoring dashboard           (host port 3000)
#   worker      - COLMAP reconstruction engine  (no port — volume-based)
#
# Port Map (NO CONFLICTS):
#   3001 → Frontend (Next.js)
#   8001 → Backend  (FastAPI)
#   9090 → Prometheus
#   3000 → Grafana
#
# Volumes:
#   neo3d_datasets   - Raw + preprocessed images (shared: backend ↔ worker)
#   neo3d_outputs    - Final PLY files served to Three.js
#   neo3d_logs       - Structured JSON logs
#   neo3d_grafana    - Grafana dashboard state (persists dashboards/settings)
#
# Network:
#   neo3d_net - Internal bridge network. Services talk by service name.
#               Only explicitly mapped ports are exposed to the host.
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND — Next.js
  # Host: 3001 → Container: 3000
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: neo3d-frontend:latest
    container_name: neo3d_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND — FastAPI
  # Host: 8001 → Container: 8001
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: neo3d-backend:latest
    container_name: neo3d_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - COLMAP_PATH=${COLMAP_PATH:-/usr/bin/colmap}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-2048}
      - MIN_IMAGES=${MIN_IMAGES:-5}
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
    volumes:
      - neo3d_datasets:/app/datasets
      - neo3d_outputs:/app/outputs
      - neo3d_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMETHEUS — Metrics Scraper
  # Scrapes /metrics from FastAPI backend every 15s
  # Host: 9090 → Container: 9090
  # Uses official prom/prometheus image (no build needed)
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: neo3d_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - neo3d_net
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # GRAFANA — Monitoring Dashboard
  # Host: 3000 → Container: 3000
  # Default login: admin / admin
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: neo3d_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - neo3d_grafana:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - neo3d_net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # WORKER — COLMAP Reconstruction Engine
  # profile: ["reconstruction"] → does NOT start with `docker compose up`
  # Run manually: docker compose run worker
  # ─────────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: neo3d-worker:latest
    container_name: neo3d_worker
    profiles:
      - reconstruction
    environment:
      - COLMAP_PATH=${COLMAP_PATH:-/usr/bin/colmap}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - PYTHONUTF8=1
    volumes:
      - neo3d_datasets:/datasets
      - neo3d_outputs:/outputs
      - neo3d_logs:/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
    networks:
      - neo3d_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  neo3d_datasets:
    name: neo3d_datasets
  neo3d_outputs:
    name: neo3d_outputs
  neo3d_logs:
    name: neo3d_logs
  neo3d_grafana:
    name: neo3d_grafana

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────────────────────
networks:
  neo3d_net:
    driver: bridge
    name: neo3d_network
