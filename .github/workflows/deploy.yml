name: Neo3D CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Smoke Test — verify backend compiles and imports correctly
  # Runs on EVERY push and PR
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: "🧪 Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Import Smoke Test
        run: |
          python -c "import sys; sys.path.append('backend'); from api.main import app; print('✅ Neo3D backend compiled and imported successfully!')"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy — SSH into EC2, pull latest code, rebuild and restart all
  # Only runs on push to main (NOT on pull requests)
  # Requires secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to EC2"
    runs-on: ubuntu-latest
    needs: verify          # only deploy if smoke test passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Neo3D Auto-Deploy — $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── Navigate to project ────────────────────────
            cd ~/neo3d || { echo "❌ Project folder not found at ~/neo3d"; exit 1; }

            # ── Pull latest code ───────────────────────────
            echo "📥 Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # ── Rebuild and restart services ───────────────
            echo "🔨 Building and starting containers..."
            docker compose down --remove-orphans
            docker compose up --build -d

            # ── Wait for backend health check ──────────────
            echo "⏳ Waiting for backend to become healthy..."
            sleep 20

            # ── Verify all containers are running ──────────
            echo ""
            echo "📋 Running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # ── Quick health check ─────────────────────────
            curl -sf http://localhost:8001/api/v1/health/ \
              && echo "✅ Backend healthy" \
              || echo "⚠️  Backend health check failed — check logs: docker logs neo3d_backend"

            echo ""
            echo "✅ Deploy complete!"
            echo "  Frontend:   http://${{ secrets.EC2_HOST }}:3001"
            echo "  API:        http://${{ secrets.EC2_HOST }}:8001/docs"
            echo "  Prometheus: http://${{ secrets.EC2_HOST }}:9090"
            echo "  Grafana:    http://${{ secrets.EC2_HOST }}:3000"
