name: Neo3D Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Verification & Smoke Test
  # ─────────────────────────────────────────────────────────────────────────────
  backend-verify:
    name: "🧪 Backend Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Imports
        run: |
          python -c "import sys; sys.path.append('backend'); from api.main import app; print('✅ Neo3D backend compiled and imported successfully!')"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Build Verification
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "⚛️ Frontend Build Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Production Build Test
        working-directory: ./frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Docker Image Compilation
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build Check"
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Dockerfile
        run: docker build -t neo3d-backend-test -f docker/backend/Dockerfile .

      - name: Verify Frontend Dockerfile
        run: docker build -t neo3d-frontend-test -f docker/frontend/Dockerfile .

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: AWS EC2 Deployment
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to AWS EC2"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Neo3D Auto-Deploy — $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd ~/nerf-3d-reconstruction || { echo "❌ Project folder not found"; exit 1; }

            echo "📥 Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building and starting containers..."
            docker compose down --remove-orphans
            docker compose up --build -d

            echo "⏳ Waiting for services to initialize..."
            sleep 15

            echo "✅ Deploy complete! Systems are online."
