name: Neo3D Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Verification & Smoke Test
  # ─────────────────────────────────────────────────────────────────────────────
  backend-verify:
    name: "🧪 Backend Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Imports
        run: |
          python -c "import sys; sys.path.append('backend'); from api.main import app; print('✅ Neo3D backend compiled and imported successfully!')"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Build Verification
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "⚛️ Frontend Build Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Production Build Test
        working-directory: ./frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Docker Image Compilation
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build Check"
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Dockerfile
        run: docker build -t neo3d-backend-test -f docker/backend/Dockerfile .

      - name: Verify Frontend Dockerfile
        run: docker build -t neo3d-frontend-test -f docker/frontend/Dockerfile .

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Prepare Deployment Artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  package-release:
    name: "📦 Prepare Release"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Generate Release Manifest
        run: |
          echo "Generating deployment manifest for Neo3D..."
          mkdir -p release
          cp docker-compose.yml release/
          echo '{"version": "3.0.1", "build_date": "'$(date)'"}' > release/build-info.json
          tar -czvf neo3d-release.tar.gz release/
          
      - name: Verify Artifacts
        run: |
          echo "✅ Artifacts generated successfully."
          ls -lh neo3d-release.tar.gz
