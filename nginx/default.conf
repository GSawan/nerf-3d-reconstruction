# ═══════════════════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy for Neo3D Production
#
# Routes:
#   /              → Next.js Frontend (port 3000)
#   /api/*         → FastAPI Backend (port 8000)
#   /metrics       → FastAPI Prometheus metrics (backend:8000/metrics)
#   /grafana/*     → Grafana (port 3000 internal)
#   /prometheus/*  → Prometheus (port 9090)
# ═══════════════════════════════════════════════════════════════════════════════

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

upstream grafana {
    server grafana:3000;
}

upstream prometheus {
    server prometheus:9090;
}

server {
    listen 80;
    server_name _;

    # ── Security Headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Upload limit (2GB for image datasets) ─────────────────────────────────
    client_max_body_size 2048m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # ── FastAPI Backend API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ── Prometheus Metrics endpoint (direct from backend) ─────────────────────
    location /metrics {
        proxy_pass http://backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Grafana Dashboard ──────────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Grafana live websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Prometheus UI ──────────────────────────────────────────────────────────
    location /prometheus/ {
        proxy_pass http://prometheus/prometheus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Next.js Frontend (catch-all) ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js HMR websocket support
        proxy_cache_bypass $http_upgrade;
    }
}
